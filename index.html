<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zyqor Intern | Small Projects. Big Opportunities.</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900 flex flex-col min-h-screen">
  <div id="root" class="flex-grow flex flex-col"></div>

  <!-- Firebase Modular Scripts CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAUZTle5J7FSu_Af6xLebmtN8M9g69DIxw",
      authDomain: "zyqor-intern.firebaseapp.com",
      projectId: "zyqor-intern",
      storageBucket: "zyqor-intern.firebasestorage.app",
      messagingSenderId: "209139233286",
      appId: "1:209139233286:web:308e9ac0462d5e15c24987",
      measurementId: "G-1GTDNLXQSV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.fbMethods = { collection, getDocs, addDoc, query, orderBy };
  </script>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_OPPORTUNITIES = [
      { id: '1', title: "Frontend Developer Intern", company: "Nova Labs", budget: 12000, duration: "4 Weeks", type: "Remote", category: "Technology", skills: ["React", "JavaScript", "HTML"], match: 94, applicants: 12, verified: true },
      { id: '2', title: "UI/UX Design Project", company: "PixelForge", budget: 8000, duration: "2 Weeks", type: "Hybrid", category: "Design", skills: ["Figma", "UI/UX", "Wireframing"], match: 88, applicants: 5, verified: true },
      { id: '3', title: "Social Media Strategy", company: "NextGrid", budget: 5000, duration: "7 Days", type: "Remote", category: "Marketing", skills: ["Marketing", "Content", "Strategy"], match: 82, applicants: 18, verified: false },
      { id: '4', title: "Data Analysis Project", company: "Finova", budget: 9000, duration: "3 Weeks", type: "Remote", category: "Data", skills: ["Excel", "Python", "Data Analysis"], match: 75, applicants: 4, verified: true },
    ];

    const STUDENT_USER = { name: "Soham", role: "student", skills: ["React", "JavaScript", "Figma", "HTML"] };
    const COMPANY_USER = { name: "Nova Labs", role: "company" };

    function App() {
      const [currentView, setCurrentView] = useState('landing');
      const [currentUser, setCurrentUser] = useState(null); 
      const [opportunities, setOpportunities] = useState(INITIAL_OPPORTUNITIES);
      const [applications, setApplications] = useState([]);
      const [savedApps, setSavedApps] = useState([]);
      const [activeModal, setActiveModal] = useState(null);
      const [selectedOpp, setSelectedOpp] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("All");

      // Load data from Firebase or Fallback
      useEffect(() => {
        const fetchOpps = async () => {
          try {
            if (window.db && window.fbMethods) {
              const { collection, getDocs, query, orderBy } = window.fbMethods;
              const q = query(collection(window.db, "opportunities"), orderBy("timestamp", "desc"));
              const snapshot = await getDocs(q);
              const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              if (list.length > 0) {
                setOpportunities(list);
              }
            }
          } catch (err) {
            console.log("Using default mock list due to network/rules constraint:", err);
          }
        };
        fetchOpps();

        const localApps = localStorage.getItem('zyqor_applications');
        const localSaved = localStorage.getItem('zyqor_saved');
        if (localApps) setApplications(JSON.parse(localApps));
        if (localSaved) setSavedApps(JSON.parse(localSaved));
      }, []);

      useEffect(() => {
        localStorage.setItem('zyqor_applications', JSON.stringify(applications));
        localStorage.setItem('zyqor_saved', JSON.stringify(savedApps));
      }, [applications, savedApps]);

      const showToast = (msg) => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };

      const handleLogin = (role) => {
        const user = role === 'student' ? STUDENT_USER : COMPANY_USER;
        setCurrentUser(user);
        setCurrentView(role === 'student' ? 'student-dashboard' : 'company-dashboard');
        setActiveModal(null);
        showToast(`Logged in as ${user.name}`);
        window.scrollTo(0,0);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setCurrentView('landing');
        showToast('Logged out successfully');
      };

      const handleApply = (e) => {
        e.preventDefault();
        if (!currentUser || currentUser.role !== 'student') {
          setActiveModal('login-student');
          return;
        }
        const newApp = {
          id: Date.now().toString(),
          oppId: selectedOpp.id,
          title: selectedOpp.title,
          company: selectedOpp.company,
          status: 'Under Review',
          date: new Date().toLocaleDateString()
        };
        setApplications([newApp, ...applications]);
        setActiveModal(null);
        showToast('✓ Application submitted successfully');
      };

      const handlePostOpportunity = async (e) => {
        e.preventDefault();
        const form = e.target;
        const newOpp = {
          title: form.title.value,
          company: currentUser ? currentUser.name : "Nova Labs",
          budget: Number(form.budget.value),
          duration: form.duration.value,
          type: form.type.value,
          category: form.category.value,
          skills: form.skills.value.split(',').map(s => s.trim()),
          match: Math.floor(Math.random() * 20) + 78,
          applicants: 0,
          verified: true,
          timestamp: Date.now()
        };

        try {
          if (window.db && window.fbMethods) {
            const { collection, addDoc } = window.fbMethods;
            const docRef = await addDoc(collection(window.db, "opportunities"), newOpp);
            setOpportunities([{ id: docRef.id, ...newOpp }, ...opportunities]);
          } else {
            setOpportunities([{ id: Date.now().toString(), ...newOpp }, ...opportunities]);
          }
          setActiveModal(null);
          showToast('✓ Opportunity posted to Firebase Database!');
        } catch (err) {
          setOpportunities([{ id: Date.now().toString(), ...newOpp }, ...opportunities]);
          setActiveModal(null);
          showToast('✓ Opportunity posted locally!');
        }
      };

      const toggleSave = (id, e) => {
        e.stopPropagation();
        if (savedApps.includes(id)) {
          setSavedApps(savedApps.filter(sId => sId !== id));
          showToast('Removed from saved items');
        } else {
          setSavedApps([...savedApps, id]);
          showToast('✓ Opportunity saved');
        }
      };

      // Filter logic
      const filteredOpportunities = opportunities.filter(p => {
        const matchesSearch = p.title?.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              p.company?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              p.skills?.some(s => s.toLowerCase().includes(searchQuery.toLowerCase()));
        const matchesCategory = selectedCategory === "All" || p.category === selectedCategory;
        return matchesSearch && matchesCategory;
      });

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
          
          {/* NAVBAR */}
          <nav className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200">
            <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => setCurrentView('landing')}>
                <div className="w-8 h-8 rounded bg-blue-600 flex items-center justify-center text-white font-bold text-xl leading-none">Z</div>
                <span className="font-bold text-xl tracking-tight text-slate-900">Zyqor Intern</span>
              </div>
              
              <div className="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600">
                {!currentUser ? (
                  <>
                    <a href="#how-it-works" className="hover:text-blue-600 transition-colors">How It Works</a>
                    <button onClick={() => setCurrentView('explore')} className="hover:text-blue-600 transition-colors">Explore</button>
                    <a href="#business-model" className="hover:text-blue-600 transition-colors">Business Model</a>
                  </>
                ) : (
                  <>
                    <button onClick={() => setCurrentView(`${currentUser.role}-dashboard`)} className={currentView.includes('dashboard') ? "text-blue-600 font-semibold" : "hover:text-blue-600"}>Dashboard</button>
                    <button onClick={() => setCurrentView('explore')} className={currentView === 'explore' ? "text-blue-600 font-semibold" : "hover:text-blue-600"}>Explore</button>
                  </>
                )}
              </div>

              <div className="flex items-center gap-3">
                {!currentUser ? (
                  <>
                    <button onClick={() => setActiveModal('login-student')} className="hidden sm:inline-block px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-900">Student Login</button>
                    <button onClick={() => setActiveModal('login-company')} className="px-5 py-2.5 bg-blue-600 text-white rounded-full text-sm font-medium hover:bg-blue-700 shadow-sm">Hire Talent</button>
                  </>
                ) : (
                  <div className="flex items-center gap-3">
                    <span className="text-sm font-medium hidden sm:inline-block text-slate-600">Hi, {currentUser.name}</span>
                    {currentUser.role === 'company' && (
                      <button onClick={() => setActiveModal('post-opp')} className="hidden sm:flex items-center gap-1 px-4 py-2 bg-blue-600 text-white rounded-full text-sm font-medium hover:bg-blue-700">
                        <span className="text-base">+</span> Post
                      </button>
                    )}
                    <button onClick={handleLogout} className="px-4 py-2 border border-slate-200 rounded-full text-sm font-medium hover:bg-slate-50">Logout</button>
                  </div>
                )}
              </div>
            </div>
          </nav>

          {/* MAIN VIEWS */}
          <main className="flex-grow pb-20 md:pb-0">
            {currentView === 'landing' && (
              <div>
                {/* HERO */}
                <section className="relative pt-20 pb-24 overflow-hidden">
                  <div className="max-w-7xl mx-auto px-6 grid lg:grid-cols-2 gap-16 items-center">
                    <div className="max-w-2xl">
                      <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-sm font-medium mb-6">
                        Small Projects. Big Opportunities.
                      </div>
                      <h1 className="text-5xl lg:text-7xl font-bold tracking-tight text-slate-900 leading-[1.1] mb-6">
                        Your Career Starts<br />
                        <span className="text-blue-600">Before Graduation.</span>
                      </h1>
                      <p className="text-lg text-slate-600 mb-8 leading-relaxed max-w-xl">
                        Zyqor Intern connects students with companies through paid micro-internships, short-term projects and real-world opportunities.
                      </p>
                      <div className="flex flex-wrap items-center gap-4 mb-8">
                        <button onClick={() => setCurrentView('explore')} className="px-8 py-3 bg-blue-600 text-white rounded-full font-medium hover:bg-blue-700 shadow-sm">Find Opportunities</button>
                        <button onClick={() => setActiveModal('login-company')} className="px-8 py-3 bg-white border border-slate-200 text-slate-800 rounded-full font-medium hover:bg-slate-50">Hire Student Talent</button>
                      </div>
                    </div>

                    {/* Preview Card */}
                    <div className="relative hidden lg:block">
                      <div className="absolute inset-0 bg-blue-50 rounded-[2rem] transform rotate-3 scale-105 -z-10"></div>
                      <div className="bg-white rounded-[2rem] shadow-xl border border-slate-100 p-8 relative z-10">
                        <div className="flex justify-between items-start mb-6">
                          <div>
                            <h3 className="text-xl font-bold text-slate-900">Frontend Developer Intern</h3>
                            <p className="text-slate-500 text-sm mt-1 flex items-center gap-1">Nova Labs ✓ Verified</p>
                          </div>
                          <span className="bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-sm font-bold">94% Match</span>
                        </div>
                        <div className="grid grid-cols-2 gap-4 mb-6">
                          <div className="bg-slate-50 rounded-xl p-3">
                            <div className="text-slate-400 text-xs uppercase font-semibold mb-1">Stipend</div>
                            <div className="font-semibold text-slate-900">₹8,000 - ₹12,000</div>
                          </div>
                          <div className="bg-slate-50 rounded-xl p-3">
                            <div className="text-slate-400 text-xs uppercase font-semibold mb-1">Duration</div>
                            <div className="font-semibold text-slate-900">4 Weeks</div>
                          </div>
                        </div>
                        <div className="mb-6">
                          <div className="text-slate-400 text-xs uppercase font-semibold mb-2">Skills</div>
                          <div className="flex flex-wrap gap-2">
                            {["React", "JavaScript", "UI/UX"].map(s => (
                              <span key={s} className="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-md">{s}</span>
                            ))}
                          </div>
                        </div>
                        <button onClick={() => setCurrentView('explore')} className="w-full py-3 bg-blue-600 text-white rounded-full font-medium hover:bg-blue-700">Explore All</button>
                      </div>
                    </div>
                  </div>
                </section>

                {/* HOW IT WORKS */}
                <section className="py-24 bg-white" id="how-it-works">
                  <div className="max-w-7xl mx-auto px-6">
                    <h2 className="text-3xl md:text-4xl font-bold text-center text-slate-900 mb-16">How Zyqor Intern Works</h2>
                    <div className="grid md:grid-cols-2 gap-16">
                      <div>
                        <h3 className="text-2xl font-bold mb-8 text-blue-600">For Students</h3>
                        <div className="space-y-6">
                          {[
                            { step: "01", title: "Discover", desc: "Find opportunities matching your exact skills." },
                            { step: "02", title: "Apply", desc: "Send your profile and quick application." },
                            { step: "03", title: "Work", desc: "Complete the micro-internship or project." },
                            { step: "04", title: "Grow", desc: "Earn experience, money, and verified reviews." }
                          ].map((s) => (
                            <div key={s.step} className="flex gap-4">
                              <div className="text-blue-200 font-bold text-xl">{s.step}</div>
                              <div>
                                <h4 className="font-bold text-slate-900">{s.title}</h4>
                                <p className="text-slate-600 text-sm mt-0.5">{s.desc}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                      <div>
                        <h3 className="text-2xl font-bold mb-8 text-slate-900">For Companies</h3>
                        <div className="space-y-6">
                          {[
                            { step: "01", title: "Post", desc: "Create a short-term opportunity." },
                            { step: "02", title: "Match", desc: "Our algorithm finds relevant students." },
                            { step: "03", title: "Select", desc: "Shortlist and hire the best candidates instantly." },
                            { step: "04", title: "Scale", desc: "Get work completed flexibly without full-time overhead." }
                          ].map((s) => (
                            <div key={s.step} className="flex gap-4">
                              <div className="text-slate-300 font-bold text-xl">{s.step}</div>
                              <div>
                                <h4 className="font-bold text-slate-900">{s.title}</h4>
                                <p className="text-slate-600 text-sm mt-0.5">{s.desc}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
              </div>
            )}

            {currentView === 'explore' && (
              <div className="max-w-7xl mx-auto px-6 py-8">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
                  <div>
                    <h1 className="text-3xl font-bold text-slate-900 mb-2">Find Opportunities</h1>
                    <p className="text-slate-600">Discover short-term projects and micro-internships from live database.</p>
                  </div>
                  <div className="w-full md:w-80 relative">
                    <input 
                      type="text" placeholder="Search skills, titles..." 
                      className="w-full pl-4 pr-4 py-2.5 rounded-full border border-slate-200 focus:outline-none focus:border-blue-600 text-sm bg-white"
                      value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                    />
                  </div>
                </div>

                {/* Categories */}
                <div className="flex overflow-x-auto gap-2 mb-8 pb-2 custom-scrollbar">
                  {["All", "Technology", "Marketing", "Design", "Data", "Business"].map(cat => (
                    <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors border ${selectedCategory === cat ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}>
                      {cat}
                    </button>
                  ))}
                </div>

                {/* Grid */}
                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredOpportunities.map((opp) => (
                    <div key={opp.id} className="bg-white rounded-2xl p-6 border border-slate-200 hover:shadow-lg transition-all flex flex-col group cursor-pointer" 
                         onClick={() => { setSelectedOpp(opp); setActiveModal('opp-details'); }}>
                      <div className="flex justify-between items-start mb-4">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center font-bold text-slate-700">{opp.company?.charAt(0) || 'Z'}</div>
                          <div>
                            <p className="text-sm font-medium text-slate-900">{opp.company}</p>
                            <p className="text-xs text-slate-500">{opp.type}</p>
                          </div>
                        </div>
                        <button onClick={(e) => toggleSave(opp.id, e)} className="p-2 text-slate-400 hover:text-red-500">
                          <span className={savedApps.includes(opp.id) ? "text-red-500 font-bold" : ""}>♥</span>
                        </button>
                      </div>
                      
                      <h3 className="font-bold text-lg text-slate-900 mb-2 group-hover:text-blue-600 transition-colors">{opp.title}</h3>
                      
                      <div className="flex items-center gap-4 text-sm text-slate-600 mb-6 font-medium">
                        <span>₹{opp.budget}</span>
                        <span>{opp.duration}</span>
                      </div>

                      <div className="mt-auto pt-4 border-t border-slate-100">
                        <div className="flex flex-wrap gap-2 mb-4">
                          {opp.skills?.map((s) => <span key={s} className="bg-slate-50 text-slate-600 text-xs px-2 py-1 rounded font-medium">{s}</span>)}
                        </div>
                        <div className="flex items-center justify-between text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg">
                          <span>Match Score</span>
                          <span>{opp.match || 90}%</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {currentView === 'student-dashboard' && currentUser && (
              <div className="max-w-7xl mx-auto px-6 py-8">
                <h1 className="text-3xl font-bold text-slate-900 mb-2">Good morning, {currentUser.name} 👋</h1>
                <p className="text-slate-600 mb-8">Here is your student activity tracking overview.</p>
                <div className="grid grid-cols-2 gap-4 mb-8">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <div className="text-sm text-slate-500 mb-1">Applications Sent</div>
                    <div className="text-3xl font-bold text-slate-900">{applications.length}</div>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <div className="text-sm text-slate-500 mb-1">Saved Opportunities</div>
                    <div className="text-3xl font-bold text-slate-900">{savedApps.length}</div>
                  </div>
                </div>
                <h2 className="text-xl font-bold text-slate-900 mb-4">Your Applications</h2>
                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden p-6">
                  {applications.length === 0 ? (
                    <p className="text-slate-500 text-sm">No applications submitted yet. Browse the explore page to apply!</p>
                  ) : (
                    <div className="space-y-4">
                      {applications.map(app => (
                        <div key={app.id} className="p-4 border border-slate-100 rounded-xl flex justify-between items-center">
                          <div>
                            <h4 className="font-bold text-slate-900">{app.title}</h4>
                            <p className="text-xs text-slate-500">{app.company} • Applied on {app.date}</p>
                          </div>
                          <span className="text-xs bg-amber-50 text-amber-700 font-medium px-3 py-1 rounded-full">{app.status}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {currentView === 'company-dashboard' && currentUser && (
              <div className="max-w-7xl mx-auto px-6 py-8">
                <div className="flex justify-between items-center mb-8">
                  <div>
                    <h1 className="text-3xl font-bold text-slate-900 mb-1">Company Dashboard</h1>
                    <p className="text-slate-600">Post short-term projects and track candidates.</p>
                  </div>
                  <button onClick={() => setActiveModal('post-opp')} className="px-5 py-2.5 bg-blue-600 text-white rounded-full text-sm font-medium hover:bg-blue-700">+ Post Opportunity</button>
                </div>
                <div className="bg-white rounded-2xl border border-slate-200 p-6">
                  <h3 className="font-bold text-lg mb-4">Your Live Postings</h3>
                  <div className="space-y-3">
                    {opportunities.filter(o => o.company === currentUser.name).length === 0 ? (
                      <p className="text-slate-500 text-sm">No active postings found. Click '+ Post Opportunity' to publish one globally.</p>
                    ) : (
                      opportunities.filter(o => o.company === currentUser.name).map(opp => (
                        <div key={opp.id} className="p-4 border rounded-xl flex justify-between items-center">
                          <div>
                            <h4 className="font-bold">{opp.title}</h4>
                            <p className="text-xs text-slate-500">₹{opp.budget} • {opp.duration}</p>
                          </div>
                          <span className="text-xs bg-blue-50 text-blue-700 px-3 py-1 rounded font-bold">{opp.applicants || 0} applicants</span>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* MOBILE BOTTOM NAVIGATION */}
          {currentUser && (
            <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around items-center h-16 pb-safe z-40 shadow-lg">
              <button onClick={() => setCurrentView(`${currentUser.role}-dashboard`)} className={`flex flex-col items-center gap-1 ${currentView.includes('dashboard') ? 'text-blue-600 font-bold' : 'text-slate-500'}`}>
                <span className="text-xs">Dashboard</span>
              </button>
              <button onClick={() => setCurrentView('explore')} className={`flex flex-col items-center gap-1 ${currentView === 'explore' ? 'text-blue-600 font-bold' : 'text-slate-500'}`}>
                <span className="text-xs">Explore</span>
              </button>
              {currentUser.role === 'company' && (
                <button onClick={() => setActiveModal('post-opp')} className="flex flex-col items-center gap-1 text-blue-600 font-bold">
                  <span className="text-xs">+ Post</span>
                </button>
              )}
            </div>
          )}

          {/* MODALS */}
          {activeModal === 'login-student' && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-lg">Student Login</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); handleLogin('student'); }} className="space-y-4">
                  <input type="email" required placeholder="student@university.edu" className="w-full px-4 py-2.5 rounded-xl border text-sm" />
                  <input type="password" required placeholder="Password" className="w-full px-4 py-2.5 rounded-xl border text-sm" />
                  <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-full font-medium text-sm">Log In as Student</button>
                </form>
              </div>
            </div>
          )}

          {activeModal === 'login-company' && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-lg">Company Login</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); handleLogin('company'); }} className="space-y-4">
                  <input type="email" required placeholder="hr@novalabs.com" className="w-full px-4 py-2.5 rounded-xl border text-sm" />
                  <input type="password" required placeholder="Password" className="w-full px-4 py-2.5 rounded-xl border text-sm" />
                  <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-full font-medium text-sm">Log In as Company</button>
                </form>
              </div>
            </div>
          )}

          {activeModal === 'post-opp' && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-lg">Post an Opportunity</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <form onSubmit={handlePostOpportunity} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Title</label>
                    <input name="title" required placeholder="e.g. Frontend React Project" className="w-full px-4 py-2.5 rounded-xl border text-sm" />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Stipend (₹)</label>
                      <input name="budget" type="number" required placeholder="10000" className="w-full px-4 py-2.5 rounded-xl border text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Duration</label>
                      <input name="duration" required placeholder="e.g. 3 Weeks" className="w-full px-4 py-2.5 rounded-xl border text-sm" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Work Mode</label>
                      <select name="type" className="w-full px-4 py-2.5 rounded-xl border text-sm bg-white">
                        <option>Remote</option><option>Hybrid</option><option>On-site</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Category</label>
                      <select name="category" className="w-full px-4 py-2.5 rounded-xl border text-sm bg-white">
                        <option>Technology</option><option>Design</option><option>Marketing</option><option>Data</option><option>Business</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Required Skills (comma separated)</label>
                    <input name="skills" required placeholder="React, JavaScript, Tailwind" className="w-full px-4 py-2.5 rounded-xl border text-sm" />
                  </div>
                  <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-full font-medium text-sm">Post to Firebase Database</button>
                </form>
              </div>
            </div>
          )}

          {activeModal === 'opp-details' && selectedOpp && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex justify-between items-start mb-2">
                  <h3 className="font-bold text-xl">{selectedOpp.title}</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <p className="text-sm font-medium text-slate-500 mb-6">{selectedOpp.company} • {selectedOpp.type}</p>
                
                <div className="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl mb-6 text-sm">
                  <div>
                    <div className="text-xs text-slate-400 font-bold uppercase">Stipend</div>
                    <div className="font-bold text-slate-900">₹{selectedOpp.budget}</div>
                  </div>
                  <div>
                    <div className="text-xs text-slate-400 font-bold uppercase">Duration</div>
                    <div className="font-bold text-slate-900">{selectedOpp.duration}</div>
                  </div>
                </div>

                <div className="mb-6">
                  <div className="text-xs text-slate-400 font-bold uppercase mb-2">Required Skills</div>
                  <div className="flex flex-wrap gap-1.5">
                    {selectedOpp.skills?.map(s => <span key={s} className="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded font-medium">{s}</span>)}
                  </div>
                </div>

                {applications.some(a => a.oppId === selectedOpp.id) ? (
                  <div className="w-full py-3 text-center bg-green-50 text-green-700 font-medium rounded-full text-sm">✓ Application Submitted</div>
                ) : (
                  <form onSubmit={handleApply}>
                    <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-full font-medium text-sm hover:bg-blue-700">Apply Now</button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATIONS */}
          <div className="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2">
            {toasts.map(t => (
              <div key={t.id} className="bg-slate-900 text-white text-sm px-5 py-3 rounded-xl shadow-2xl font-medium animate-in slide-in-from-bottom-2">
                {t.msg}
              </div>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
