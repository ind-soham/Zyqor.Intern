<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zyqor Intern | Small Projects. Big Opportunities.</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (Standalone for browser JSX parsing) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900 flex flex-col min-h-screen">
  <div id="root" class="flex-grow flex flex-col"></div>

  <!-- Firebase Modular Scripts CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAUZTle5J7FSu_Af6xLebmtN8M9g69DIxw",
      authDomain: "zyqor-intern.firebaseapp.com",
      projectId: "zyqor-intern",
      storageBucket: "zyqor-intern.firebasestorage.app",
      messagingSenderId: "209139233286",
      appId: "1:209139233286:web:308e9ac0462d5e15c24987",
      measurementId: "G-1GTDNLXQSV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.fbMethods = { collection, getDocs, addDoc, query, orderBy };
  </script>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Default mock data with 8 Salesforce Ecommerce Architecture parameters
    const INITIAL_PROJECTS = [
      {
        id: '1',
        title: "Frontend Micro-Internship",
        company: "Nova Labs",
        category: "Technology",
        budget: 12000,
        duration: "4 Weeks",
        type: "Remote",
        skills: ["React", "JavaScript", "HTML"],
        totalSlots: 2,
        filledSlots: 1,
        match: 94,
        applicants: 12,
        verified: true,
        escrowLocked: true,
        fulfillmentStatus: "In Progress",
        submissionLink: "https://github.com/example/pr-14"
      },
      {
        id: '2',
        title: "UI/UX Checkout Redesign",
        company: "PixelForge",
        category: "Design",
        budget: 8500,
        duration: "2 Weeks",
        type: "Hybrid",
        skills: ["Figma", "UI/UX", "Wireframing"],
        totalSlots: 1,
        filledSlots: 0,
        match: 89,
        applicants: 6,
        verified: true,
        escrowLocked: true,
        fulfillmentStatus: "Not Started",
        submissionLink: ""
      },
      {
        id: '3',
        title: "Social Growth & Content Engine",
        company: "NextGrid",
        category: "Marketing",
        budget: 5000,
        duration: "7 Days",
        type: "Remote",
        skills: ["Marketing", "Content", "Canva"],
        totalSlots: 3,
        filledSlots: 2,
        match: 82,
        applicants: 19,
        verified: false,
        escrowLocked: false,
        fulfillmentStatus: "Under Review",
        submissionLink: "https://drive.google.com/sample-campaign"
      },
      {
        id: '4',
        title: "Customer Survey Analytics & Python Script",
        company: "Finova",
        category: "Data",
        budget: 9000,
        duration: "3 Weeks",
        type: "Remote",
        skills: ["Excel", "Python", "Data Analysis"],
        totalSlots: 1,
        filledSlots: 0,
        match: 76,
        applicants: 4,
        verified: true,
        escrowLocked: true,
        fulfillmentStatus: "Not Started",
        submissionLink: ""
      }
    ];

    const STUDENT_USER = { name: "Soham", role: "student", skills: ["React", "JavaScript", "Figma", "HTML"] };
    const COMPANY_USER = { name: "Nova Labs", role: "company" };

    function App() {
      const [currentView, setCurrentView] = useState('storefront');
      const [currentUser, setCurrentUser] = useState(null);
      const [projects, setProjects] = useState(INITIAL_PROJECTS);
      const [applications, setApplications] = useState([]);
      const [tickets, setTickets] = useState([
        { id: "TCK-108", topic: "Milestone 1 Scope Clarification", sender: "Soham", status: "Resolved", priority: "Low" },
        { id: "TCK-109", topic: "Escrow Release Verification on PR approval", sender: "Nova Labs", status: "Open", priority: "Medium" }
      ]);
      const [savedProjects, setSavedProjects] = useState([]);
      const [activeModal, setActiveModal] = useState(null);
      const [selectedProject, setSelectedProject] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [toasts, setToasts] = useState([]);

      // 1. Database sync (Firebase with local fallback)
      useEffect(() => {
        const fetchRemoteProjects = async () => {
          try {
            if (window.db && window.fbMethods) {
              const { collection, getDocs, query, orderBy } = window.fbMethods;
              const q = query(collection(window.db, "opportunities"), orderBy("timestamp", "desc"));
              const snap = await getDocs(q);
              const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              if (list.length > 0) {
                setProjects(list);
              }
            }
          } catch(e) {
            console.log("Firebase fallback active (using in-memory store):", e);
          }
        };

        fetchRemoteProjects();

        const localApps = localStorage.getItem('zyqor_apps');
        const localSaved = localStorage.getItem('zyqor_favs');
        if (localApps) setApplications(JSON.parse(localApps));
        if (localSaved) setSavedProjects(JSON.parse(localSaved));
      }, []);

      useEffect(() => {
        localStorage.setItem('zyqor_apps', JSON.stringify(applications));
        localStorage.setItem('zyqor_favs', JSON.stringify(savedProjects));
      }, [applications, savedProjects]);

      const showToast = (msg) => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };

      const handleLogin = (role) => {
        const user = role === 'student' ? STUDENT_USER : COMPANY_USER;
        setCurrentUser(user);
        setCurrentView(role === 'student' ? 'student-dash' : 'company-dash');
        setActiveModal(null);
        showToast(`Signed in as ${user.name} (${role})`);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setCurrentView('storefront');
        showToast("Signed out successfully");
      };

      // 2. Application Flow
      const handleApply = (e) => {
        e.preventDefault();
        if (!currentUser || currentUser.role !== 'student') {
          setActiveModal('login-student');
          return;
        }

        const projectToApply = selectedProject;
        if (projectToApply.filledSlots >= projectToApply.totalSlots) {
          showToast("⚠️ All available slots for this project are filled!");
          return;
        }

        const newApp = {
          id: "APP-" + Math.floor(Math.random() * 9000 + 1000),
          projectId: projectToApply.id,
          title: projectToApply.title,
          company: projectToApply.company,
          budget: projectToApply.budget,
          status: "Under Review",
          deliveryStatus: "Pending Submission",
          submissionUrl: "",
          date: new Date().toLocaleDateString()
        };

        setApplications([newApp, ...applications]);
        setActiveModal(null);
        showToast("✓ Application & profile dispatched to company!");
      };

      // 3. Post a Project (Inventory + Gateway Setup)
      const handlePostProject = async (e) => {
        e.preventDefault();
        const form = e.target;
        const budgetVal = Number(form.budget.value);
        const slotsVal = Number(form.slots.value) || 1;

        const newProj = {
          title: form.title.value,
          company: currentUser ? currentUser.name : "Nova Labs",
          category: form.category.value,
          budget: budgetVal,
          duration: form.duration.value,
          type: form.type.value,
          skills: form.skills.value.split(',').map(s => s.trim()),
          totalSlots: slotsVal,
          filledSlots: 0,
          match: Math.floor(Math.random() * 15) + 82,
          applicants: 0,
          verified: true,
          escrowLocked: true,
          fulfillmentStatus: "Open",
          submissionLink: "",
          timestamp: Date.now()
        };

        try {
          if (window.db && window.fbMethods) {
            const { collection, addDoc } = window.fbMethods;
            const ref = await addDoc(collection(window.db, "opportunities"), newProj);
            setProjects([{ id: ref.id, ...newProj }, ...projects]);
          } else {
            setProjects([{ id: "P-" + Date.now(), ...newProj }, ...projects]);
          }
        } catch(err) {
          setProjects([{ id: "P-" + Date.now(), ...newProj }, ...projects]);
        }

        setActiveModal(null);
        showToast("✓ Project published & Escrow deposit registered!");
      };

      // 4. Digital Logistics & Fulfillment: Student submits deliverable URL
      const handleDeliverySubmission = (appId, url) => {
        if (!url) {
          showToast("Please provide a valid URL or repository link.");
          return;
        }
        setApplications(applications.map(a => a.id === appId ? { ...a, deliveryStatus: "Delivered & Under Review", submissionUrl: url } : a));
        showToast("✓ Deliverable package dispatched for company sign-off!");
      };

      // 5. Payment Gateway: Escrow release
      const handleReleaseEscrow = (projId) => {
        setProjects(projects.map(p => p.id === projId ? { ...p, fulfillmentStatus: "Completed & Paid" } : p));
        showToast("✓ Payment Gateway: Escrow released (88% Student, 12% Zyqor fee)!");
      };

      // 6. Marketing Integration: Broadcast opportunity
      const handleMarketingBroadcast = (projectTitle) => {
        showToast(`📢 Talent Broadcast dispatched for "${projectTitle}" to 1,200+ matched candidates!`);
      };

      // 7. Support module: New ticket
      const handleCreateTicket = (e) => {
        e.preventDefault();
        const f = e.target;
        const newTick = {
          id: "TCK-" + Math.floor(Math.random() * 900 + 100),
          topic: f.topic.value,
          sender: currentUser ? currentUser.name : "Guest",
          status: "Open",
          priority: f.priority.value
        };
        setTickets([newTick, ...tickets]);
        f.reset();
        showToast("✓ Support ticket logged with Arbitration Desk.");
      };

      // Filtered projects
      const filtered = projects.filter(p => {
        const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              p.company.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              p.skills.some(s => s.toLowerCase().includes(searchQuery.toLowerCase()));
        const matchesCat = selectedCategory === "All" || p.category === selectedCategory;
        return matchesSearch && matchesCat;
      });

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          
          {/* HEADER / NAVIGATION */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('storefront')}>
                <div className="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-black text-xl shadow-sm">Z</div>
                <div>
                  <span className="font-extrabold text-lg sm:text-xl tracking-tight text-slate-900 block leading-tight">Zyqor Intern</span>
                  <span className="text-[10px] text-slate-400 font-semibold tracking-wider uppercase block sm:inline">Small Projects. Big Opportunities.</span>
                </div>
              </div>

              {/* View Switcher Tabs (Salesforce E-Commerce Hub) */}
              <div className="hidden lg:flex items-center gap-1 bg-slate-100 p-1 rounded-full text-xs font-semibold text-slate-600">
                <button onClick={() => setCurrentView('storefront')} className={`px-3 py-1.5 rounded-full transition ${currentView === 'storefront' ? 'bg-white text-blue-600 shadow-sm' : 'hover:text-slate-900'}`}>Storefront</button>
                <button onClick={() => setCurrentView('payment-gateway')} className={`px-3 py-1.5 rounded-full transition ${currentView === 'payment-gateway' ? 'bg-white text-blue-600 shadow-sm' : 'hover:text-slate-900'}`}>Payment Gateway</button>
                <button onClick={() => setCurrentView('logistics')} className={`px-3 py-1.5 rounded-full transition ${currentView === 'logistics' ? 'bg-white text-blue-600 shadow-sm' : 'hover:text-slate-900'}`}>Delivery & Fulfillment</button>
                <button onClick={() => setCurrentView('analytics')} className={`px-3 py-1.5 rounded-full transition ${currentView === 'analytics' ? 'bg-white text-blue-600 shadow-sm' : 'hover:text-slate-900'}`}>Analytics</button>
                <button onClick={() => setCurrentView('support')} className={`px-3 py-1.5 rounded-full transition ${currentView === 'support' ? 'bg-white text-blue-600 shadow-sm' : 'hover:text-slate-900'}`}>Support Desk</button>
              </div>

              {/* User Login/Account Area */}
              <div className="flex items-center gap-2 sm:gap-3">
                {!currentUser ? (
                  <>
                    <button onClick={() => setActiveModal('login-student')} className="text-xs sm:text-sm font-medium text-slate-600 hover:text-slate-900 px-3 py-1.5">Student Login</button>
                    <button onClick={() => setActiveModal('login-company')} className="bg-blue-600 text-white rounded-full text-xs sm:text-sm font-semibold px-4 py-2 hover:bg-blue-700 shadow-sm">Hire Talent</button>
                  </>
                ) : (
                  <div className="flex items-center gap-2">
                    <button onClick={() => setCurrentView(currentUser.role === 'student' ? 'student-dash' : 'company-dash')} className="text-xs sm:text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full border border-blue-100">
                      {currentUser.name} ({currentUser.role})
                    </button>
                    {currentUser.role === 'company' && (
                      <button onClick={() => setActiveModal('post-project')} className="bg-blue-600 text-white rounded-full text-xs font-semibold px-3 py-1.5 hover:bg-blue-700">+ Post Project</button>
                    )}
                    <button onClick={handleLogout} className="text-xs text-slate-400 hover:text-slate-700 font-medium px-2 py-1">Logout</button>
                  </div>
                )}
              </div>

            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-grow pb-24">
            
            {/* 1. STOREFRONT VIEW (Online Storefront & Matching) */}
            {currentView === 'storefront' && (
              <div>
                {/* Hero Section */}
                <section className="pt-12 pb-16 px-4 sm:px-6 max-w-7xl mx-auto text-center">
                  <div className="inline-flex items-center gap-2 bg-blue-50 border border-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-semibold mb-6">
                    <span className="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span> B2B2C Talent Exchange Engine
                  </div>
                  <h1 className="text-4xl sm:text-6xl font-black text-slate-900 tracking-tight leading-[1.1] mb-6">
                    Your Career Starts<br /><span className="text-blue-600">Before Graduation.</span>
                  </h1>
                  <p className="text-base sm:text-lg text-slate-600 max-w-2xl mx-auto mb-8">
                    Zyqor Intern connects students with verified companies through paid micro-internships, short-term tasks, and real-world project portfolios.
                  </p>
                  <div className="flex flex-wrap items-center justify-center gap-3">
                    <button onClick={() => {
                      document.getElementById('catalog-anchor').scrollIntoView({ behavior: 'smooth' });
                    }} className="px-6 py-3 rounded-full bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 shadow-md">
                      Browse Digital Storefront
                    </button>
                    <button onClick={() => setActiveModal('login-company')} className="px-6 py-3 rounded-full bg-white border border-slate-200 text-slate-800 font-semibold text-sm hover:bg-slate-50">
                      Post as Business
                    </button>
                  </div>
                </section>

                {/* Catalog Controls */}
                <section id="catalog-anchor" className="max-w-7xl mx-auto px-4 sm:px-6 pt-4 pb-8">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                    <div>
                      <h2 className="text-2xl font-bold text-slate-900">Live Opportunity Catalog</h2>
                      <p className="text-slate-500 text-xs sm:text-sm">Real-time inventory of verified business micro-projects</p>
                    </div>

                    <div className="w-full md:w-80">
                      <input 
                        type="text" 
                        placeholder="Search projects, skills, or companies..." 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full px-4 py-2.5 rounded-full border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-600"
                      />
                    </div>
                  </div>

                  {/* Category Filter Pills */}
                  <div className="flex overflow-x-auto gap-2 pb-2 mb-6 custom-scrollbar text-xs font-semibold">
                    {["All", "Technology", "Design", "Marketing", "Data"].map(cat => (
                      <button 
                        key={cat} 
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-4 py-2 rounded-full border transition whitespace-nowrap ${selectedCategory === cat ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  {/* Product Grid */}
                  <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filtered.map(proj => {
                      const isSoldOut = proj.filledSlots >= proj.totalSlots;
                      return (
                        <div 
                          key={proj.id} 
                          onClick={() => { setSelectedProject(proj); setActiveModal('project-detail'); }}
                          className="bg-white border border-slate-200 rounded-2xl p-6 hover:shadow-lg transition-all duration-200 cursor-pointer flex flex-col justify-between"
                        >
                          <div>
                            <div className="flex justify-between items-start mb-3">
                              <span className="font-bold text-sm bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg">{proj.category}</span>
                              <span className={`text-xs font-bold px-2.5 py-1 rounded-md ${isSoldOut ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-700'}`}>
                                {isSoldOut ? 'Slots Full' : `${proj.totalSlots - proj.filledSlots} Slot Remaining`}
                              </span>
                            </div>

                            <h3 className="font-bold text-lg text-slate-900 mb-1 leading-snug">{proj.title}</h3>
                            <p className="text-xs text-slate-500 font-medium mb-4">{proj.company} {proj.verified && '✓'}</p>

                            <div className="grid grid-cols-2 gap-2 bg-slate-50 rounded-xl p-3 mb-4 text-xs">
                              <div>
                                <span className="text-slate-400 block font-semibold">Stipend</span>
                                <span className="font-extrabold text-slate-800 text-sm">₹{proj.budget.toLocaleString()}</span>
                              </div>
                              <div>
                                <span className="text-slate-400 block font-semibold">Timeline</span>
                                <span className="font-extrabold text-slate-800 text-sm">{proj.duration}</span>
                              </div>
                            </div>

                            <div className="flex flex-wrap gap-1.5 mb-4">
                              {proj.skills.map(s => (
                                <span key={s} className="bg-slate-100 text-slate-600 text-[11px] font-medium px-2 py-0.5 rounded">{s}</span>
                              ))}
                            </div>
                          </div>

                          <div className="pt-4 border-t border-slate-100 flex items-center justify-between text-xs">
                            <div className="text-blue-600 font-bold bg-blue-50 px-2.5 py-1 rounded">
                              {proj.match}% Match
                            </div>
                            <button className="font-semibold text-blue-600 hover:text-blue-700">View Details &rarr;</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>
              </div>
            )}

            {/* 2. PAYMENT GATEWAY & ESCROW MODULE */}
            {currentView === 'payment-gateway' && (
              <section className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
                <div className="mb-6">
                  <h2 className="text-2xl sm:text-3xl font-bold text-slate-900">Payment Gateway & Escrow Ledger</h2>
                  <p className="text-slate-600 text-sm">Automated escrow protection preventing company non-payment & student non-delivery.</p>
                </div>

                <div className="grid sm:grid-cols-3 gap-4 mb-8">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <span className="text-xs text-slate-400 font-bold uppercase block mb-1">Total Escrow Vault</span>
                    <span className="text-2xl font-black text-slate-900">₹34,500</span>
                    <span className="text-xs text-green-600 font-semibold block mt-1">100% Protected Funds</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <span className="text-xs text-slate-400 font-bold uppercase block mb-1">Zyqor Fee Model</span>
                    <span className="text-2xl font-black text-blue-600">12.0%</span>
                    <span className="text-xs text-slate-400 block mt-1">Commission on project completion</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <span className="text-xs text-slate-400 font-bold uppercase block mb-1">Disbursed to Students</span>
                    <span className="text-2xl font-black text-green-600">₹1,42,000</span>
                    <span className="text-xs text-slate-400 block mt-1">Zero payment disputes</span>
                  </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                  <div className="p-4 bg-slate-50 border-b border-slate-200 text-sm font-bold text-slate-700">Active Escrow Contracts</div>
                  <div className="divide-y divide-slate-100 text-xs sm:text-sm">
                    {projects.map(p => (
                      <div key={p.id} className="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                          <span className="font-bold text-slate-900 block">{p.title}</span>
                          <span className="text-slate-500 text-xs">Buyer: {p.company} • Stipend: ₹{p.budget}</span>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className={`px-2.5 py-1 rounded text-xs font-bold ${p.fulfillmentStatus.includes('Paid') ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                            {p.fulfillmentStatus}
                          </span>
                          {currentUser?.role === 'company' && !p.fulfillmentStatus.includes('Paid') && (
                            <button 
                              onClick={() => handleReleaseEscrow(p.id)}
                              className="bg-green-600 hover:bg-green-700 text-white font-semibold px-3 py-1.5 rounded-lg text-xs"
                            >
                              Release Escrow
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            )}

            {/* 3. DIGITAL LOGISTICS & FULFILLMENT */}
            {currentView === 'logistics' && (
              <section className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
                <div className="mb-6">
                  <h2 className="text-2xl sm:text-3xl font-bold text-slate-900">Digital Delivery & Fulfillment Tracking</h2>
                  <p className="text-slate-600 text-sm">Replacing physical freight shipping with verified GitHub code PRs, Figma links, & deliverables.</p>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 p-6">
                  <h3 className="font-bold text-base mb-4 text-slate-900">Your Active Project Deliverables</h3>
                  {applications.length === 0 ? (
                    <div className="text-center py-8 text-slate-400 text-sm">
                      No active assignments. Apply to a project on the Storefront to access the delivery upload pipeline.
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {applications.map(app => (
                        <div key={app.id} className="p-4 border rounded-xl border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                          <div>
                            <span className="font-bold text-slate-900 block">{app.title}</span>
                            <span className="text-xs text-slate-500">Contract ID: {app.id} • Company: {app.company}</span>
                            <span className="block mt-1 text-xs font-semibold text-blue-600">Status: {app.deliveryStatus}</span>
                          </div>

                          <div className="flex items-center gap-2">
                            <input 
                              id={`url-${app.id}`}
                              type="text" 
                              placeholder="Paste GitHub/Figma URL" 
                              defaultValue={app.submissionUrl}
                              className="px-3 py-1.5 border rounded-lg text-xs w-48 sm:w-64"
                            />
                            <button 
                              onClick={() => {
                                const input = document.getElementById(`url-${app.id}`);
                                handleDeliverySubmission(app.id, input.value);
                              }}
                              className="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs px-3 py-1.5 rounded-lg whitespace-nowrap"
                            >
                              Dispatch Deliverable
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </section>
            )}

            {/* 4. ANALYTICS & TELEMETRY */}
            {currentView === 'analytics' && (
              <section className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
                <div className="mb-6">
                  <h2 className="text-2xl sm:text-3xl font-bold text-slate-900">Marketplace Data & Business Analytics</h2>
                  <p className="text-slate-600 text-sm">Real-time marketplace metrics across GMV, student placement rates, and match accuracy.</p>
                </div>

                <div className="grid sm:grid-cols-4 gap-4 mb-8">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <span className="text-xs text-slate-400 font-bold uppercase block mb-1">Catalog Opportunities</span>
                    <span className="text-3xl font-black text-slate-900">{projects.length}</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <span className="text-xs text-slate-400 font-bold uppercase block mb-1">Average Time-to-Match</span>
                    <span className="text-3xl font-black text-blue-600">38 hrs</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <span className="text-xs text-slate-400 font-bold uppercase block mb-1">Skill Match Precision</span>
                    <span className="text-3xl font-black text-green-600">91.4%</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <span className="text-xs text-slate-400 font-bold uppercase block mb-1">Applications Processed</span>
                    <span className="text-3xl font-black text-slate-900">{applications.length + 41}</span>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-2xl border border-slate-200">
                  <h3 className="font-bold text-sm text-slate-700 mb-4">Talent Demand by Technology</h3>
                  <div className="space-y-3 text-xs font-semibold">
                    <div>
                      <div className="flex justify-between mb-1"><span>React & TypeScript</span><span>78% Demand</span></div>
                      <div className="w-full bg-slate-100 h-2 rounded-full"><div className="bg-blue-600 h-2 rounded-full" style={{ width: '78%' }}></div></div>
                    </div>
                    <div>
                      <div className="flex justify-between mb-1"><span>Figma & Design Systems</span><span>64% Demand</span></div>
                      <div className="w-full bg-slate-100 h-2 rounded-full"><div className="bg-blue-600 h-2 rounded-full" style={{ width: '64%' }}></div></div>
                    </div>
                    <div>
                      <div className="flex justify-between mb-1"><span>Python & Data Pipelines</span><span>52% Demand</span></div>
                      <div className="w-full bg-slate-100 h-2 rounded-full"><div className="bg-blue-600 h-2 rounded-full" style={{ width: '52%' }}></div></div>
                    </div>
                  </div>
                </div>
              </section>
            )}

            {/* 5. SUPPORT & CUSTOMER ARBITRATION */}
            {currentView === 'support' && (
              <section className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
                <div className="mb-6">
                  <h2 className="text-2xl sm:text-3xl font-bold text-slate-900">Customer Support & Arbitration Desk</h2>
                  <p className="text-slate-600 text-sm">Dispute resolution, payment queries, and project milestone arbitration.</p>
                </div>

                <div className="grid md:grid-cols-2 gap-6">
                  <div className="bg-white p-6 rounded-2xl border border-slate-200">
                    <h3 className="font-bold text-base mb-4">Submit a Support Ticket</h3>
                    <form onSubmit={handleCreateTicket} className="space-y-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Topic / Query</label>
                        <input name="topic" required placeholder="e.g. Question on Milestone 2 Escrow Release" className="w-full p-2.5 border rounded-xl text-xs" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Priority</label>
                        <select name="priority" className="w-full p-2.5 border rounded-xl text-xs bg-white">
                          <option>Low</option>
                          <option>Medium</option>
                          <option>High (Dispute)</option>
                        </select>
                      </div>
                      <button type="submit" className="w-full py-2.5 bg-blue-600 text-white font-semibold rounded-full text-xs hover:bg-blue-700">
                        Create Ticket
                      </button>
                    </form>
                  </div>

                  <div className="bg-white p-6 rounded-2xl border border-slate-200">
                    <h3 className="font-bold text-base mb-4">Your Open Inquiries</h3>
                    <div className="space-y-3 text-xs">
                      {tickets.map(t => (
                        <div key={t.id} className="p-3 border rounded-xl border-slate-100 flex justify-between items-center">
                          <div>
                            <span className="font-bold text-slate-800 block">{t.topic}</span>
                            <span className="text-[11px] text-slate-400">ID: {t.id} • Raised by: {t.sender}</span>
                          </div>
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${t.status === 'Resolved' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}`}>
                            {t.status}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </section>
            )}

            {/* 6. STUDENT DASHBOARD */}
            {currentView === 'student-dash' && currentUser && (
              <section className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
                <div className="mb-6">
                  <h1 className="text-3xl font-black text-slate-900">Good morning, {currentUser.name} 👋</h1>
                  <p className="text-slate-600 text-sm">Here is your verified micro-internship activity overview.</p>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <span className="text-xs text-slate-400 font-bold uppercase block mb-1">Applications</span>
                    <span className="text-2xl font-black text-slate-900">{applications.length}</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <span className="text-xs text-slate-400 font-bold uppercase block mb-1">Active Deliveries</span>
                    <span className="text-2xl font-black text-blue-600">{applications.filter(a => a.deliveryStatus.includes('Delivered')).length}</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <span className="text-xs text-slate-400 font-bold uppercase block mb-1">Escrow Pending</span>
                    <span className="text-2xl font-black text-amber-600">₹{applications.reduce((acc, c) => acc + c.budget, 0).toLocaleString()}</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200">
                    <span className="text-xs text-slate-400 font-bold uppercase block mb-1">Profile Score</span>
                    <span className="text-2xl font-black text-green-600">92%</span>
                  </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 p-6">
                  <h3 className="font-bold text-base mb-4">Your Application Tracker</h3>
                  {applications.length === 0 ? (
                    <p className="text-sm text-slate-400">No applications sent yet. Go to the Storefront to apply.</p>
                  ) : (
                    <div className="space-y-3">
                      {applications.map(app => (
                        <div key={app.id} className="p-4 border rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs">
                          <div>
                            <span className="font-bold text-slate-900 text-sm block">{app.title}</span>
                            <span className="text-slate-500">{app.company} • Applied on {app.date} • ₹{app.budget}</span>
                          </div>
                          <span className="bg-blue-50 text-blue-700 font-bold px-3 py-1 rounded-full">{app.status}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </section>
            )}

            {/* 7. COMPANY DASHBOARD */}
            {currentView === 'company-dash' && currentUser && (
              <section className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                  <div>
                    <h1 className="text-3xl font-black text-slate-900">Company Project Console</h1>
                    <p className="text-slate-600 text-sm">Manage job slots, release escrow payments, & broadcast marketing notifications.</p>
                  </div>
                  <button onClick={() => setActiveModal('post-project')} className="px-5 py-2.5 bg-blue-600 text-white rounded-full font-bold text-xs hover:bg-blue-700 shadow-sm">
                    + Post Micro-Project
                  </button>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 p-6">
                  <h3 className="font-bold text-base mb-4">Your Active Inventory Slots</h3>
                  <div className="space-y-4 text-xs sm:text-sm">
                    {projects.map(p => (
                      <div key={p.id} className="p-4 border rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                          <span className="font-bold text-slate-900 block text-base">{p.title}</span>
                          <span className="text-slate-500 text-xs">
                            Budget: ₹{p.budget} • Slots: {p.filledSlots}/{p.totalSlots} claimed • Status: {p.fulfillmentStatus}
                          </span>
                        </div>
                        <div className="flex items-center gap-2">
                          <button 
                            onClick={() => handleMarketingBroadcast(p.title)}
                            className="bg-purple-50 text-purple-700 font-semibold px-3 py-1.5 rounded-lg border border-purple-100 hover:bg-purple-100 text-xs"
                          >
                            📢 Broadcast Push
                          </button>
                          {!p.fulfillmentStatus.includes('Paid') && (
                            <button 
                              onClick={() => handleReleaseEscrow(p.id)}
                              className="bg-green-600 hover:bg-green-700 text-white font-semibold px-3 py-1.5 rounded-lg text-xs"
                            >
                              Release Escrow
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            )}

          </main>

          {/* MOBILE QUICK NAVIGATION */}
          <div className="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around items-center h-16 pb-safe z-40 shadow-lg text-[11px] font-bold text-slate-500">
            <button onClick={() => setCurrentView('storefront')} className={currentView === 'storefront' ? 'text-blue-600' : ''}>Storefront</button>
            <button onClick={() => setCurrentView('payment-gateway')} className={currentView === 'payment-gateway' ? 'text-blue-600' : ''}>Gateway</button>
            <button onClick={() => setCurrentView('logistics')} className={currentView === 'logistics' ? 'text-blue-600' : ''}>Delivery</button>
            <button onClick={() => setCurrentView('support')} className={currentView === 'support' ? 'text-blue-600' : ''}>Help</button>
          </div>

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 py-10 border-t border-slate-800 text-center text-xs">
            <div className="max-w-7xl mx-auto px-4">
              <div className="font-bold text-white text-base mb-1">Zyqor Intern</div>
              <p className="max-w-md mx-auto mb-4">The Next-Gen B2B2C Micro-Internship Marketplace. Built with Salesforce Enterprise Architecture.</p>
              <div className="text-slate-600">© 2026 Zyqor Intern. All rights reserved.</div>
            </div>
          </footer>

          {/* --- MODALS --- */}

          {/* Project Details Modal */}
          {activeModal === 'project-detail' && selectedProject && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl">
                <div className="flex justify-between items-start mb-2">
                  <h3 className="font-extrabold text-xl text-slate-900">{selectedProject.title}</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <p className="text-xs text-slate-500 font-semibold mb-4">{selectedProject.company} • {selectedProject.type}</p>

                <div className="grid grid-cols-2 gap-3 bg-slate-50 p-4 rounded-xl mb-4 text-xs font-semibold">
                  <div>
                    <span className="text-slate-400 block text-[10px] uppercase font-bold">Stipend (In Escrow)</span>
                    <span className="text-base font-black text-slate-900">₹{selectedProject.budget.toLocaleString()}</span>
                  </div>
                  <div>
                    <span className="text-slate-400 block text-[10px] uppercase font-bold">Slot Capacity</span>
                    <span className="text-base font-black text-slate-900">{selectedProject.totalSlots - selectedProject.filledSlots} of {selectedProject.totalSlots} open</span>
                  </div>
                </div>

                <div className="mb-6">
                  <span className="text-[10px] uppercase font-bold text-slate-400 block mb-2">Required Skills</span>
                  <div className="flex flex-wrap gap-1.5">
                    {selectedProject.skills.map(s => <span key={s} className="bg-slate-100 px-2 py-1 rounded text-xs font-semibold text-slate-700">{s}</span>)}
                  </div>
                </div>

                {selectedProject.filledSlots >= selectedProject.totalSlots ? (
                  <div className="w-full py-3 bg-slate-100 text-slate-400 font-bold text-center rounded-full text-xs">
                    Slots Filled (Inventory Out of Stock)
                  </div>
                ) : (
                  <form onSubmit={handleApply}>
                    <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-full text-xs shadow-md">
                      Confirm Application & Dispatch Profile
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Post Project Modal */}
          {activeModal === 'post-project' && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-lg">Post an Opportunity</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <form onSubmit={handlePostProject} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-500 uppercase text-[10px] block mb-1">Project Title</label>
                    <input name="title" required placeholder="e.g. Node.js API Service Integration" className="w-full p-2.5 border rounded-xl" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-500 uppercase text-[10px] block mb-1">Stipend (₹)</label>
                      <input name="budget" type="number" required placeholder="8000" className="w-full p-2.5 border rounded-xl" />
                    </div>
                    <div>
                      <label className="font-bold text-slate-500 uppercase text-[10px] block mb-1">Slot Capacity</label>
                      <input name="slots" type="number" defaultValue={1} min={1} className="w-full p-2.5 border rounded-xl" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-500 uppercase text-[10px] block mb-1">Category</label>
                      <select name="category" className="w-full p-2.5 border rounded-xl bg-white">
                        <option>Technology</option><option>Design</option><option>Marketing</option><option>Data</option>
                      </select>
                    </div>
                    <div>
                      <label className="font-bold text-slate-500 uppercase text-[10px] block mb-1">Duration</label>
                      <input name="duration" required placeholder="e.g. 3 Weeks" className="w-full p-2.5 border rounded-xl" />
                    </div>
                  </div>
                  <div>
                    <label className="font-bold text-slate-500 uppercase text-[10px] block mb-1">Mode</label>
                    <select name="type" className="w-full p-2.5 border rounded-xl bg-white">
                      <option>Remote</option><option>Hybrid</option><option>On-site</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-bold text-slate-500 uppercase text-[10px] block mb-1">Skills (comma-separated)</label>
                    <input name="skills" required placeholder="React, Tailwind, Express" className="w-full p-2.5 border rounded-xl" />
                  </div>
                  <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-full text-xs shadow-md mt-2">
                    Deposit Escrow & Publish
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Student Login Modal */}
          {activeModal === 'login-student' && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-base">Student Portal Login</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400">✕</button>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); handleLogin('student'); }} className="space-y-3">
                  <input type="email" required placeholder="soham@university.edu" className="w-full p-2.5 border rounded-xl text-xs" />
                  <input type="password" required placeholder="••••••••" className="w-full p-2.5 border rounded-xl text-xs" />
                  <button type="submit" className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-full text-xs">
                    Sign In as Student
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Company Login Modal */}
          {activeModal === 'login-company' && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-base">Company Account Login</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400">✕</button>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); handleLogin('company'); }} className="space-y-3">
                  <input type="email" required placeholder="hiring@novalabs.com" className="w-full p-2.5 border rounded-xl text-xs" />
                  <input type="password" required placeholder="••••••••" className="w-full p-2.5 border rounded-xl text-xs" />
                  <button type="submit" className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-full text-xs">
                    Sign In as Company
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notification Container */}
          <div className="fixed bottom-20 sm:bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2">
            {toasts.map(t => (
              <div key={t.id} className="bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full shadow-2xl font-bold flex items-center gap-2">
                <span>{t.msg}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
