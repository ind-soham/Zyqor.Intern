<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyqor Intern | Small Projects. Big Opportunities.</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#FAFAFA',
                        foreground: '#111111',
                        accent: '#0055FF',
                        accentHover: '#0044CC',
                        surface: '#FFFFFF',
                        border: '#E5E5E5',
                        muted: '#737373',
                    },
                    boxShadow: {
                        'subtle': '0 1px 2px rgba(0, 0, 0, 0.04)',
                        'float': '0 8px 30px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; color: #111111; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .spinner { border: 3px solid rgba(0,85,255,0.1); border-left-color: #0055FF; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased selection:bg-accent selection:text-white min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-background/80 backdrop-blur-md border-b border-border">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <button onclick="navigate('home')" class="flex flex-col leading-none text-left focus:outline-none">
                <span class="font-bold tracking-tight text-lg text-foreground">ZYQOR</span>
                <span class="text-[10px] font-medium tracking-widest text-accent uppercase">Intern</span>
            </button>
            <div class="hidden md:flex items-center gap-8">
                <button onclick="navigate('marketplace')" class="text-sm font-medium text-muted hover:text-foreground transition-colors">Marketplace</button>
                <button class="text-sm font-medium text-muted hover:text-foreground transition-colors">For Companies</button>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="navigate('dashboard')" class="text-sm font-medium text-foreground hover:text-accent transition-colors">Dashboard</button>
                <button onclick="navigate('marketplace')" class="bg-accent text-white px-5 py-2.5 rounded-md text-sm font-medium hover:bg-accentHover transition-colors shadow-sm hidden md:block">Get Started</button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area (Injected by JS) -->
    <main id="app-root" class="flex-1 w-full"></main>

    <!-- Global Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-foreground text-white px-6 py-3 rounded-lg shadow-float transform translate-y-20 opacity-0 transition-all duration-300 z-50 text-sm font-medium flex items-center gap-3">
        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-message">Success!</span>
    </div>

    <script>
        // --- MOCK DATABASE ---
        const MOCK_PROJECTS = [
            { id: 1, title: "Landing Page Refresh", company: "SaaS Startup", category: "Frontend", duration: "1-2 weeks", price: "₹5,000", tags: ["React", "Tailwind"] },
            { id: 2, title: "Social Media Content Pack", company: "D2C Brand", category: "Design", duration: "1 week", price: "₹3,000", tags: ["Figma", "Canva"] },
            { id: 3, title: "Survey Data Cleanup", company: "Research Agency", category: "Data", duration: "3-5 days", price: "₹2,000", tags: ["Excel", "Python"] }
        ];

        const appRoot = document.getElementById('app-root');

        // --- ROUTING SYSTEM ---
        function navigate(view) {
            appRoot.innerHTML = ''; 
            if (view === 'home') renderHome();
            if (view === 'marketplace') renderMarketplace();
            if (view === 'dashboard') renderDashboard();
            window.scrollTo(0, 0);
        }

        // --- VIEWS ---
        function renderHome() {
            appRoot.innerHTML = `
                <div class="fade-in flex flex-col items-center justify-center text-center px-6 py-32 max-w-4xl mx-auto">
                    <span class="bg-blue-50 text-accent border border-blue-100 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider mb-8">Platform Live</span>
                    <h1 class="text-5xl md:text-7xl font-semibold tracking-tight text-foreground mb-6 leading-[1.1]">Small Projects.<br>Big Opportunities.</h1>
                    <p class="text-lg md:text-xl text-muted max-w-2xl mb-10 leading-relaxed">Real-world work for students. Focused execution for growing businesses. Bridge the experience gap without the 6-month commitment.</p>
                    <div class="flex gap-4 w-full justify-center">
                        <button onclick="navigate('marketplace')" class="bg-accent text-white px-8 py-4 rounded-md text-base font-medium hover:bg-accentHover transition-colors shadow-sm">Explore Projects</button>
                        <button onclick="simulateBackendAction('Registering company...')" class="bg-surface text-foreground border border-border px-8 py-4 rounded-md text-base font-medium hover:bg-gray-50 transition-colors shadow-subtle">Post a Project</button>
                    </div>
                </div>
            `;
        }

        function renderMarketplace() {
            // Render Skeleton/Loading State first to simulate Backend fetch
            appRoot.innerHTML = `
                <div class="max-w-7xl mx-auto px-6 py-12 fade-in">
                    <div class="mb-10">
                        <h2 class="text-3xl font-semibold tracking-tight mb-2">Live Marketplace</h2>
                        <p class="text-muted">Fetching latest projects from the database...</p>
                    </div>
                    <div class="flex items-center justify-center py-20">
                        <div class="spinner"></div>
                        <span class="ml-4 text-sm font-medium text-muted">Connecting to server...</span>
                    </div>
                </div>
            `;

            // Simulate Network Delay
            setTimeout(() => {
                const projectCards = MOCK_PROJECTS.map(p => `
                    <div class="bg-surface border border-border p-6 rounded-xl shadow-subtle hover:border-accent/50 hover:shadow-md transition-all flex flex-col">
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-zinc-100 text-zinc-600 border border-zinc-200 px-2.5 py-0.5 rounded-full text-xs font-medium">${p.category}</span>
                            <span class="text-sm font-medium text-muted">${p.duration}</span>
                        </div>
                        <h3 class="text-xl font-semibold mb-1">${p.title}</h3>
                        <p class="text-sm text-muted mb-4">${p.company}</p>
                        <div class="flex gap-2 mb-6">
                            ${p.tags.map(t => `<span class="text-xs text-muted bg-background px-2 py-1 rounded border border-border">${t}</span>`).join('')}
                        </div>
                        <div class="mt-auto pt-4 border-t border-border flex justify-between items-center">
                            <span class="font-semibold text-accent">${p.price}</span>
                            <button onclick="simulateBackendAction('Submitting application securely...')" class="bg-foreground text-white px-4 py-2 rounded text-sm font-medium hover:bg-zinc-800 transition-colors">Apply Now</button>
                        </div>
                    </div>
                `).join('');

                appRoot.innerHTML = `
                    <div class="max-w-7xl mx-auto px-6 py-12 fade-in">
                        <div class="mb-10 flex justify-between items-end">
                            <div>
                                <h2 class="text-3xl font-semibold tracking-tight mb-2">Live Marketplace</h2>
                                <p class="text-muted">${MOCK_PROJECTS.length} active micro-projects found.</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${projectCards}
                        </div>
                    </div>
                `;
            }, 1200);
        }

        function renderDashboard() {
            appRoot.innerHTML = `
                <div class="max-w-7xl mx-auto px-6 py-12 fade-in">
                    <div class="flex items-center gap-4 mb-8">
                        <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-accent to-blue-300"></div>
                        <div>
                            <h2 class="text-3xl font-semibold tracking-tight">Student Dashboard</h2>
                            <p class="text-muted">Authenticated as Soham (Demo)</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                        <div class="bg-surface border border-border p-6 rounded-xl shadow-subtle">
                            <div class="text-sm font-medium text-muted mb-2">Active Projects</div>
                            <div class="text-4xl font-semibold">1</div>
                        </div>
                        <div class="bg-surface border border-border p-6 rounded-xl shadow-subtle">
                            <div class="text-sm font-medium text-muted mb-2">Pending Applications</div>
                            <div class="text-4xl font-semibold">3</div>
                        </div>
                        <div class="bg-surface border border-border p-6 rounded-xl shadow-subtle">
                            <div class="text-sm font-medium text-muted mb-2">Total Earned</div>
                            <div class="text-4xl font-semibold text-accent">₹12,500</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- FAKE BACKEND INTERACTION ---
        function simulateBackendAction(loadingText) {
            const originalHTML = appRoot.innerHTML;
            appRoot.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[60vh]">
                    <div class="spinner mb-4 w-12 h-12 border-[4px]"></div>
                    <h3 class="text-lg font-medium">${loadingText}</h3>
                    <p class="text-sm text-muted mt-2">Encrypting data and updating database...</p>
                </div>
            `;
            
            setTimeout(() => {
                appRoot.innerHTML = originalHTML; // Restore view
                showToast("Action completed successfully.");
            }, 2000);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Init app
        navigate('home');
    </script>
</body>
</html>
